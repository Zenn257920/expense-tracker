# Build the Android APK (debug) — no Play Store, sideload only.
#
# Runs on push to main and on manual dispatch. The APK is uploaded as
# a workflow artifact named `myfinance-apk` — download it from the
# Actions run page and install the .apk file on the phone.
# There is no local Java/Android SDK in the dev environment, so the
# APK is intentionally built here, not locally.
#
# NOTE: this file cannot be pushed via the GitHub API (403) — add it
# through the GitHub website (Add file / Upload files) instead.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      # Capacitor 7's android library compiles with
      # sourceCompatibility JavaVersion.VERSION_21, so the build needs
      # JDK 21 — JDK 17 fails with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is gitignored (see .gitignore), so regenerate it from
      # the Capacitor template on every run, then sync.
      #
      # Capacitor's webDir is "out" (capacitor.config.ts). The app is a
      # live-URL wrapper (server.url = Vercel), so out/ is intentionally
      # empty — but a fresh checkout has no out/ at all and `cap sync`
      # fails with "webDir does not exist". Recreate it here before any
      # cap command runs.
      - name: Ensure Android project
        run: |
          mkdir -p out
          rm -rf android
          pnpm exec cap add android
          pnpm exec cap sync android
          # Bump versionCode/versionName so each build installs over the
          # previous one as an Update (login and data preserved).
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle
          # Voice input needs the mic. The manifest is regenerated by
          # `cap add` on every run, so declare RECORD_AUDIO here after
          # every sync. The app asks for the permission on first use;
          # without this line the system dialog can never grant it.
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|    <uses-permission android:name="android.permission.INTERNET" />|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' android/app/src/main/AndroidManifest.xml
          fi

      # A fixed keystore means every build signs with the same key, so
      # the APK installs over the previous one as an Update. Without it
      # Gradle generates a new key each run and Android refuses to
      # install over the old app.
      # keystore-debug.keystore lives at the repo root (uploaded via
      # GitHub web — binary files cannot be pushed via the API).
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore-debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        # gradlew lives inside android/, not at the repo root, so the
        # path must be ./android/gradlew (./gradlew fails with
        # "No such file or directory").
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myfinance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
